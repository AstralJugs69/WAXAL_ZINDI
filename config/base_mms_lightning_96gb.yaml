# MMS-300M for Lightning AI high-VRAM GPU (~96GB) + ~125GB RAM.
# Fresh-train recipe: dynamic padding + soft truncate + SpecAug + early stop.
# Do NOT use on Kaggle 30GB RAM — use base_mms_gpu.yaml there.
model_id: "facebook/mms-300m"
model_family: "mms"
languages:
  - "lin"
  - "sna"
  - "lug"

training:
  learning_rate: 3.0e-4
  # Dynamic padding uses less waste than fixed 20s; can keep large batches.
  # If OOM: drop to 24 then 16.
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  num_train_epochs: 5
  max_steps: -1
  precision: "16-mixed"
  gradient_clip_val: 1.0
  warmup_steps: 200
  weight_decay: 0.01
  log_every_n_steps: 25
  val_check_interval: 0.5
  limit_val_batches: 0.5
  save_top_k: 3
  early_stopping: true
  early_stopping_patience: 3
  early_stopping_min_delta: 0.005

  # --- length-aware training (P1) ---
  # Soft cap for very long clips; pad only to batch max (not fixed 20s silence).
  max_audio_seconds: 30.0
  min_audio_seconds: 0.5
  fixed_length_pad: false
  soft_truncate: true

  # --- SpecAug + waveform augs (P2) ---
  specaugment: true
  mask_time_prob: 0.05
  mask_time_length: 10
  mask_feature_prob: 0.05
  mask_feature_length: 10

  # 125GB system RAM — feed the GPU
  num_workers: 16
  prefetch_factor: 6
  pin_memory: true
  freeze_feature_encoder: false

data:
  train_csv: "Train.csv"
  test_csv: "Test.csv"
  duration_min: 1.5
  duration_max: 45.0
  wps_min: 1.0
  wps_max: 8.0
  k_folds: 5
  low_ram: false
  decode_duration_filter: false
  use_external_corpora: true
  external_corpora_sources:
    - common_voice
    - fleurs
  external_max_samples: 30000

decoding:
  beam_width: 128
  alpha: 0.5
  beta: 1.5
  build_kenlm_after_train: true
