# MMS-300M for Lightning AI single high-VRAM GPU (e.g. ~96GB) + ~125GB RAM.
# Do NOT use on Kaggle 30GB RAM — use base_mms_gpu.yaml there.
model_id: "facebook/mms-300m"
model_family: "mms"
languages:
  - "lin"
  - "sna"
  - "lug"

training:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  num_train_epochs: 8
  max_steps: -1
  precision: "16-mixed"
  gradient_clip_val: 1.0
  warmup_steps: 200
  weight_decay: 0.01
  log_every_n_steps: 25
  val_check_interval: 0.5
  save_top_k: 2
  max_audio_seconds: 16.0
  num_workers: 8

data:
  train_csv: "Train.csv"
  test_csv: "Test.csv"
  duration_min: 1.5
  duration_max: 30.0
  wps_min: 1.0
  wps_max: 8.0
  k_folds: 5
  low_ram: false
  decode_duration_filter: false
  use_external_corpora: true
  external_corpora_sources:
    - common_voice
    - fleurs
  external_max_samples: 30000

decoding:
  beam_width: 128
  alpha: 0.5
  beta: 1.5
  build_kenlm_after_train: true
