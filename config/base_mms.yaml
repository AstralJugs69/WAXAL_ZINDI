model_id: "facebook/mms-300m"
languages:
  - "lin"
  - "sna"
  - "lug"

training:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 64      # Scaled up to 64 to leverage 48GB L40S VRAM
  per_device_eval_batch_size: 64       # Scaled up to 64 for faster evaluation
  gradient_accumulation_steps: 1       # Automatic alignment will adjust this, target effective batch is 64
  target_effective_batch: 64           # Increased effective batch size for stable gradients
  num_train_epochs: 30
  fp16: true
  gradient_checkpointing: true
  warmup_steps: 500
  evaluation_strategy: "steps"
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  weight_decay: 0.01
  group_by_length: false                # Disabled to avoid LengthGroupedSampler error
  dataloader_num_workers: 12           # Increased to 12 to leverage 16 CPU cores and prevent GPU starvation

data:
  train_csv: "Train.csv"
  test_csv: "Test.csv"
  duration_min: 1.5
  duration_max: 20.0                   # Increased to 20s to allow longer clean speech segments in training
  wps_min: 1.0
  wps_max: 8.0
  k_folds: 5
  use_external_corpora: true
  external_corpora_sources:
    - common_voice
    - fleurs


decoding:
  beam_width: 128
  alpha: 0.5
  beta: 1.5
