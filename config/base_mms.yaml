model_id: "facebook/mms-300m"
languages:
  - "lin"
  - "sna"
  - "lug"

training:
  learning_rate: 1.0e-4
  # GPU defaults (L40S/A100). For Kaggle TPU use config/base_mms_tpu.yaml + run_tpu_train.py
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  target_effective_batch: 32
  num_train_epochs: 10
  fp16: true
  gradient_checkpointing: true
  warmup_steps: 500
  evaluation_strategy: "steps"
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  weight_decay: 0.01
  group_by_length: true
  dataloader_num_workers: 4

data:
  train_csv: "Train.csv"
  test_csv: "Test.csv"
  duration_min: 1.5
  duration_max: 16.0
  wps_min: 1.0
  wps_max: 8.0
  k_folds: 5
  use_external_corpora: true
  external_corpora_sources:
    - common_voice
    - fleurs
  external_max_samples: 50000


decoding:
  beam_width: 128
  alpha: 0.5
  beta: 1.5
