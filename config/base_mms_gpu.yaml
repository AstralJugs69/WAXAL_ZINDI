# MMS-300M config for Kaggle 2x T4 (16GB each).
# Run in parallel with the TPU notebook — separate session, separate /kaggle/working.
model_id: "facebook/mms-300m"
model_family: "mms"
languages:
  - "lin"
  - "sna"
  - "lug"

training:
  learning_rate: 1.0e-4
  # Kaggle GPU system RAM ~30GB: batch 1 + accum keeps VRAM/RAM safe on T4.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  # Effective batch ≈ 1 * 1 GPU * 8 = 8 (use devices=1 to avoid 2x RAM DDP copies)
  num_train_epochs: 8
  max_steps: -1
  precision: "16-mixed"
  gradient_clip_val: 1.0
  warmup_steps: 200
  weight_decay: 0.01
  log_every_n_steps: 25
  val_check_interval: 1.0
  save_top_k: 1
  max_audio_seconds: 20.0
  min_audio_seconds: 0.5
  # Dynamic pad even on Kaggle GPU (batch 1 → same as fixed for B=1)
  fixed_length_pad: false
  soft_truncate: true
  specaugment: true
  mask_time_prob: 0.05
  mask_feature_prob: 0.05
  # Must stay 0 on 30GB RAM — workers fork and double dataset footprint.
  num_workers: 0

data:
  train_csv: "Train.csv"
  test_csv: "Test.csv"
  duration_min: 1.5
  duration_max: 30.0
  wps_min: 1.0
  wps_max: 8.0
  k_folds: 5
  # Critical for Kaggle 30GB system RAM
  low_ram: true
  decode_duration_filter: false
  # External corpora deferred (prefetch+merge OOMs 30GB). Train WAXAL-only first.
  use_external_corpora: false
  external_corpora_sources:
    - fleurs
  external_max_samples: 3000

decoding:
  beam_width: 128
  alpha: 0.5
  beta: 1.5
  build_kenlm_after_train: true
